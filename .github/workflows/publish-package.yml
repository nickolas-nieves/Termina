name: Publish termina-icons to npm

# Manual, never automatic. Publishing a version number is irreversible, so it
# is a decision someone makes rather than a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options: [latest, next]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run icons:check
      - run: npm run build --workspace packages/icons

      - name: Publish
        run: npm publish --workspace packages/icons --tag ${{ inputs.tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
