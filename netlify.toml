# Netlify build for the Termina monorepo.
#
# The build runs from the repository root so npm workspaces resolve, and
# publishes the Next.js app in apps/web. The Next Runtime plugin handles the
# server routes; everything under `icons/` is baked into the build, so the
# public pages are static.

[build]
  command = "npm run icons:check && npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  # Netlify's default is fine, but pin it so a contributor's local npm and CI
  # resolve the workspace graph the same way.
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers. next.config.mjs sets these for app routes; repeating them
# here covers static assets and anything served outside the Next runtime.
[[headers]]
  for = "/*"
  [headers.values]
    # Kept in step with the `csp` constant in apps/web/next.config.mjs — change
    # both together. See the comment there for why script-src is what it is.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The public site is meant to be found. The admin console opts itself out via
# its own route metadata, and robots.txt disallows it.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
