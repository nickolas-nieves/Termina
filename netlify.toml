[build]
  publish = "public"
  # No build step — the app is a single static file.
  # `npm install` still runs so functions get @netlify/blobs.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The studio itself is passphrase-gated at the API layer, but keep it out
# of search results and out of frames regardless.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The font file is inert — rename it if it is ever regenerated, since nothing
# here busts the cache.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
